# ==============================================================
# HEG 应用配置
# 所有可变项均支持环境变量覆盖，格式: ${环境变量名:默认值}
# 环境变量完整清单见项目根目录 .env.example
# ==============================================================
server:
  port: ${HEG_SERVER_PORT:9000}

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

logging:
  config: classpath:logback-spring.xml

heg:
  # ---------- 云端连接 ----------
  cloud:
    websocket-url: ${HEG_WEBSOCKET_URL:wss://api.hiasoon.com/ws}
    app-id: ${HEG_APP_ID:}
    secret-key: ${HEG_SECRET_KEY:}
    api-base-url: ${HEG_API_BASE_URL:https://api.hiasoon.com}

  # ---------- 应用运行日志(logback输出，按天滚动) ----------
  app-log:
    path: ${HEG_LOG_PATH:/app/logs}
    level: ${HEG_LOG_LEVEL:INFO}
    retain-days: ${HEG_LOG_RETAIN_DAYS:30}

  # ---------- 运行时配置存储策略 ----------
  # memory: 内存型，热更新配置重启后丢失
  # file:   文件型，热更新配置持久化到 file-path 指定的文件
  # 注意: 使用 file 时，文件中已保存的值会覆盖上方环境变量提供的值
  config-persistence:
    type: ${HEG_CONFIG_PERSISTENCE_TYPE:file}
    file-path: ${HEG_CONFIG_FILE_PATH:/app/data/heg-runtime-config.yml}

  # ---------- 业务操作日志(SQL/Proxy明细)持久化 ----------
  log-persistence:
    enabled: ${HEG_LOG_PERSISTENCE_ENABLED:false}
    sql-log-path: ${HEG_SQL_LOG_PATH:/app/logs/sql/}
    proxy-log-path: ${HEG_PROXY_LOG_PATH:/app/logs/proxy/}
    max-file-size-mb: ${HEG_LOG_MAX_FILE_SIZE_MB:100}
    retain-days: ${HEG_LOG_RETAIN_DAYS:30}

  # ---------- 允许透传到氦闪平台的请求头(逗号分隔，不区分大小写) ----------
  proxy-headers: ${HEG_PROXY_HEADERS:X-Custom-Header,X-Request-Id,X-User-Id}

  # ---------- MySQL 数据源(URL留空则该数据源不启用) ----------
  mysql:
    - app-id: ${HEG_MYSQL_APP_ID:${HEG_APP_ID:}}
      url: ${HEG_MYSQL_URL:}
      username: ${HEG_MYSQL_USERNAME:root}
      password: ${HEG_MYSQL_PASSWORD:}
      initial-size: ${HEG_MYSQL_INITIAL_SIZE:5}
      max-active: ${HEG_MYSQL_MAX_ACTIVE:20}

  # ---------- Redis 数据源(HOST留空则该数据源不启用) ----------
  redis:
    - app-id: ${HEG_REDIS_APP_ID:${HEG_APP_ID:}}
      host: ${HEG_REDIS_HOST:}
      port: ${HEG_REDIS_PORT:6379}
      password: ${HEG_REDIS_PASSWORD:}
      database: ${HEG_REDIS_DATABASE:0}

  # ---------- MongoDB 数据源(URI留空则该数据源不启用) ----------
  mongodb:
    - app-id: ${HEG_MONGO_APP_ID:${HEG_APP_ID:}}
      uri: ${HEG_MONGO_URI:}
      database: ${HEG_MONGO_DATABASE:}
